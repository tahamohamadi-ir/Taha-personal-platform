name: CMS image

# Builds and pushes a versioned CMS image to GHCR after CMS tests pass.
# Tags:
#   ghcr.io/<owner>/taha-cms:<full-sha>
#   ghcr.io/<owner>/taha-cms:<short-sha>
#   ghcr.io/<owner>/taha-cms:main   (moving pointer on default branch only)
#
# Production must pin CMS_IMAGE to a full or short sha (immutable), not rely on :latest.

on:
  push:
    branches: [main]
    paths:
      - "apps/cms/**"
      - "infra/cms/**"
      - ".github/workflows/ci-cms.yml"
      - ".github/workflows/ci-cms-image.yml"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cms-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/taha-cms

jobs:
  test:
    name: CMS tests (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Django system check
        run: uv run python manage.py check

      - name: Migration consistency check
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q

  build-and-push:
    name: Build and push GHCR image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/cms/Dockerfile.cms
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # GHCR packages default to private. GITHUB_TOKEN often cannot change visibility
      # (404); owner can set Public in the package UI. Do not fail the image job.
      - name: Attempt to make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          OWNER="${{ github.repository_owner }}"
          PKG="taha-cms"
          for ENDPOINT in \
            "user/packages/container/${PKG}/visibility" \
            "orgs/${OWNER}/packages/container/${PKG}/visibility"
          do
            if gh api --method PUT "$ENDPOINT" -f visibility=public; then
              echo "Package visibility set via ${ENDPOINT}"
              exit 0
            fi
          done
          echo "::warning::Could not set package public via API. Owner: GitHub → Packages → taha-cms → Package settings → Change visibility → Public."
          exit 0