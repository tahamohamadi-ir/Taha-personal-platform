name: CD — Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate_cms:
        description: "Owner-attended CMS image pull + pg_dumpall + migrate + smoke (RISK-0012)"
        type: boolean
        default: false
      cms_image_tag:
        description: "CMS image tag (short or full sha). Empty = this workflow SHA short."
        type: string
        required: false
        default: ""
      rebuild_web:
        description: "Owner-attended web container rebuild via rebuild-web.sh (post-migrate publish path)"
        type: boolean
        default: false
      install_scheduled_timer:
        description: "Owner-attended systemd timer install for publish_scheduled_content (requires root sudo on VPS)"
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build static artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    outputs:
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          CMS_API_BASE: https://tahamohamadi.ir

      - name: Build fingerprint
        run: |
          version=$(node -p "require('./package.json').version")
          sha="${GITHUB_SHA:0:7}"
          date=$(date -u +%FT%TZ)
          printf 'version=%s\nsha=%s\ndate=%s\n' "$version" "$sha" "$date" > dist/build-fingerprint.txt

      - name: Smoke test (local preview)
        shell: bash
        run: |
          npx astro preview --port 4321 >/tmp/preview.log 2>&1 &
          sleep 8
          bash "${GITHUB_WORKSPACE}/infra/deploy/smoke.sh" http://localhost:4321
          kill %1 || true

      - name: Set release metadata
        id: meta
        run: echo "release_name=release-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist

      # Host /opt/taha/site/current is legacy when CADDY_EDGE=compose (live is Compose web:8080).
      # Kept for HOST-CADDY-DISABLE rollback; the following "Pull and restart web container"
      # step is authoritative for Compose edge and must not be skipped when SHORT_SHA is
      # missing (see WEB_PULL_POLICY + :main fallback there). Docs-only pushes would
      # otherwise stale web while host current updates.
      - name: Deploy via rsync + SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          RELEASE_NAME: ${{ needs.build.outputs.release_name }}
          CADDY_EDGE: ${{ vars.CADDY_EDGE }}
        run: |
          if [ "${CADDY_EDGE}" = "compose" ]; then
            echo "::notice::CADDY_EDGE=compose: host /opt/taha/site/current is legacy (live is Compose web:8080); still syncing for rollback"
          fi
          install -m 600 /dev/null ~/.ssh_deploy_key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh_deploy_key

          mkdir -p ~/.ssh
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          rsync -az --delete \
            -e "ssh -i ~/.ssh_deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:/home/${DEPLOY_USER}/taha-stage/${RELEASE_NAME}/"

          ssh -i ~/.ssh_deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /opt/taha/bin/update-release.sh /home/${DEPLOY_USER}/taha-stage/${RELEASE_NAME}"

          rm -f ~/.ssh_deploy_key

      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            infra/caddy
            infra/deploy/caddy-compose-reload.sh
          path: repo

      # Default: host systemd Caddy (caddy-sync). After DEFER-0031 live cutover,
      # set repository variable CADDY_EDGE=compose so CD reloads Compose caddy.
      - name: Sync Caddyfile (host edge)
        if: ${{ vars.CADDY_EDGE != 'compose' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
        run: |
          install -m 600 /dev/null ~/.ssh_deploy_key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh_deploy_key
          SSH_OPTS="-i ~/.ssh_deploy_key -o StrictHostKeyChecking=accept-new"

          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh_deploy_key \
            repo/infra/caddy/Caddyfile \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/Caddyfile.deploy"

          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /opt/taha/bin/caddy-sync.sh /tmp/Caddyfile.deploy"

          rm -f ~/.ssh_deploy_key

      - name: Reload Compose Caddy (edge profile)
        if: ${{ vars.CADDY_EDGE == 'compose' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
        run: |
          install -m 600 /dev/null ~/.ssh_deploy_key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh_deploy_key
          SSH_OPTS="-i ~/.ssh_deploy_key -o StrictHostKeyChecking=accept-new"

          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh_deploy_key \
            repo/infra/caddy/Caddyfile.compose \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/Caddyfile.compose.deploy"

          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             cd /home/deploy/cms-repo
             git pull --ff-only origin main || true
             cp /tmp/Caddyfile.compose.deploy infra/caddy/Caddyfile.compose
             install -m 0755 /dev/null /tmp/caddy-compose-reload.sh
             # Prefer repo script after pull; fall back to scp'd copy if present
             if [ -f infra/deploy/caddy-compose-reload.sh ]; then
               bash infra/deploy/caddy-compose-reload.sh
             else
               echo 'error: caddy-compose-reload.sh missing after pull' >&2
               exit 1
             fi"

          rm -f ~/.ssh_deploy_key

      - name: Pull and restart web container
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          CADDY_EDGE: ${{ vars.CADDY_EDGE }}
        run: |
          install -m 600 /dev/null ~/.ssh_deploy_key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh_deploy_key
          SHORT_SHA="${GITHUB_SHA:0:7}"
          WEB_IMAGE="ghcr.io/tahamohamadi-ir/taha-web:${SHORT_SHA}"
          WEB_IMAGE_FALLBACK="ghcr.io/tahamohamadi-ir/taha-web:main"
          ssh -i ~/.ssh_deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             cd /home/deploy/cms-repo
             TARGET=\"\"
             if docker pull \"${WEB_IMAGE}\" 2>/dev/null; then
               TARGET=\"${WEB_IMAGE}\"
             elif [ \"${CADDY_EDGE}\" = \"compose\" ] && docker pull \"${WEB_IMAGE_FALLBACK}\" 2>/dev/null; then
               TARGET=\"${WEB_IMAGE_FALLBACK}\"
               echo \"::warning::No web image for ${SHORT_SHA}; using fallback ${WEB_IMAGE_FALLBACK} (CADDY_EDGE=compose avoids stale web)\"
             else
               echo \"::warning::No web image for ${SHORT_SHA}; skipping web container update\"
               exit 0
             fi
             export WEB_IMAGE=\"\${TARGET}\"
             export WEB_PULL_POLICY=always
             docker compose -f infra/cms/docker-compose.cms.yml up -d web
             echo \"web container updated to \${TARGET} (CADDY_EDGE=${CADDY_EDGE:-host})\"
            "
          rm -f ~/.ssh_deploy_key

      - name: Production smoke
        env:
          SITE_URL: https://tahamohamadi.ir
        run: |
          sleep 3
          for path in / /en/ /fa/ /health.json; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}${path}")
            if [ "$status" != "200" ]; then
              echo "FAIL ${path} → ${status}"
              exit 1
            fi
            echo "PASS ${path} → ${status}"
          done

  # ADR-0027 Slice 2 / RISK-0012: CMS migrate is NOT on every push by default.
  # Owner-attended: Actions → CD → Run workflow → migrate_cms = true (after CMS image exists).
  # Later unattended: set repository variable CMS_CD_AUTO_MIGRATE=true (fails if image missing).
  cms-migrate:
    name: CMS image migrate (gated)
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.migrate_cms == true) ||
      (github.event_name == 'push' && vars.CMS_CD_AUTO_MIGRATE == 'true')
    steps:
      - name: Backup + pin CMS_IMAGE + migrate + smoke
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          CMS_TAG_INPUT: ${{ inputs.cms_image_tag || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.ssh_deploy_key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh_deploy_key
          SSH_OPTS="-i ~/.ssh_deploy_key -o StrictHostKeyChecking=accept-new"

          if [[ -n "${CMS_TAG_INPUT}" ]]; then
            TAG="${CMS_TAG_INPUT}"
          else
            TAG="${GITHUB_SHA:0:7}"
          fi
          CMS_IMAGE="ghcr.io/tahamohamadi-ir/taha-cms:${TAG}"
          echo "CMS_IMAGE=${CMS_IMAGE}"

          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             cd /home/deploy/cms-repo
             git fetch origin
             git checkout main
             git pull --ff-only origin main
             if ! docker pull \"${CMS_IMAGE}\"; then
               if [[ \"${EVENT_NAME}\" == \"workflow_dispatch\" ]]; then
                 echo \"::error::CMS image not in GHCR: ${CMS_IMAGE}. Wait for workflow CMS image, or pass cms_image_tag.\"
                 exit 1
               fi
               echo \"::warning::No CMS image for ${TAG}; skipping migrate (CMS_CD_AUTO_MIGRATE)\"
               exit 0
             fi
             export CMS_IMAGE=\"${CMS_IMAGE}\"
             export SKIP_GIT_PULL=1
             bash infra/deploy/cd-cms-migrate.sh"

          rm -f ~/.ssh_deploy_key

  # ADR-0027 Slice 1+: web container rebuild is NOT on every push.
  # Owner-attended: Actions → CD → Run workflow → rebuild_web = true.
  rebuild-web:
    name: Web container rebuild (gated)
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' && inputs.rebuild_web == true
    steps:
      - name: Pull repo + rebuild-web.sh + smoke
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.ssh_deploy_key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh_deploy_key
          SSH_OPTS="-i ~/.ssh_deploy_key -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             cd /home/deploy/cms-repo
             git fetch origin
             git checkout main
             git pull --ff-only origin main
             export SKIP_GIT_PULL=1
             bash infra/deploy/cd-rebuild-web.sh"

          rm -f ~/.ssh_deploy_key

  # OWNER_CUTOVER step 6: scheduled-publish timer is NOT on every push.
  # Owner-attended: Actions → CD → Run workflow → install_scheduled_timer = true.
  install-scheduled-timer:
    name: Scheduled publish timer install (gated)
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' && inputs.install_scheduled_timer == true
    steps:
      - name: Pull repo + install timer + verify
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.ssh_deploy_key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh_deploy_key
          SSH_OPTS="-i ~/.ssh_deploy_key -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
             cd /home/deploy/cms-repo
             git fetch origin
             git checkout main
             git pull --ff-only origin main
             export SKIP_GIT_PULL=1
             bash infra/deploy/cd-install-scheduled-publish-timer.sh"

          rm -f ~/.ssh_deploy_key
