name: CMS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  cms:
    name: Check and test CMS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        # v10.0.1 is the latest setup-uv release verified via gh api (2026-08-15).
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Django system check
        run: uv run python manage.py check

      - name: Migration consistency check
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Whitespace check
        run: git diff --check HEAD

      - name: Secret pattern scan
        shell: bash
        run: |
          if grep -rIiE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})' . --exclude-dir=.venv --exclude-dir=__pycache__ --exclude-dir=node_modules --exclude='uv.lock'; then
            echo "secret-like pattern found in CMS tree" >&2
            exit 1
          fi

  playwright-lifecycle:
    name: Playwright content lifecycle
    runs-on: ubuntu-latest
    env:
      # Override workflow-level config.settings.test (:memory:) for file-SQLite e2e.
      DJANGO_SETTINGS_MODULE: config.settings.e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json

      - name: Install CMS Python deps
        working-directory: apps/cms
        run: uv sync --python 3.12

      # ADR-0032 S1: admin SPA moved to apps/admin (own CI: ci-admin.yml).
      # CMS pipeline no longer builds it; admin_spa.py serves whatever
      # ADMIN_SPA_ROOT points at (tests use a stub dir).

      - name: Install web + Playwright
        working-directory: apps/web
        run: |
          npm ci
          timeout 180 npx playwright install chromium --with-deps

      - name: Content lifecycle (create→publish→public fa/en)
        working-directory: apps/web
        env:
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-lifecycle-report-${{ github.sha }}
          path: |
            apps/web/qa/playwright-report
            apps/web/qa/test-results
          if-no-files-found: ignore
          retention-days: 14
