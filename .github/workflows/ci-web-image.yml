name: Web image

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "infra/web/**"
      - ".github/workflows/ci-web-image.yml"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/taha-web

jobs:
  build-and-push:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: infra/web/Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CMS_API_BASE=https://tahamohamadi.ir
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Attempt to make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          OWNER="${{ github.repository_owner }}"
          PKG="taha-web"
          for ENDPOINT in \
            "user/packages/container/${PKG}/visibility" \
            "orgs/${OWNER}/packages/container/${PKG}/visibility"
          do
            if gh api --method PUT "$ENDPOINT" -f visibility=public; then
              echo "Package visibility set via ${ENDPOINT}"
              exit 0
            fi
          done
          echo "::warning::Could not set package public via API."
          exit 0
