name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Check and build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: CMS profile build regression
        run: node qa/cms-profile-build.spec.mjs

      - name: Projects catalog copy
        run: node qa/projects-catalog.spec.mjs

      - name: P8 catalog parity (mock CMS_API_BASE → API count == dist links)
        run: node qa/p8-catalog.spec.mjs

      - name: Write build fingerprint
        run: |
          version=$(node -p "require('./package.json').version")
          sha="${GITHUB_SHA:0:7}"
          date=$(date -u +%FT%TZ)
          printf 'version=%s\nsha=%s\ndate=%s\n' "$version" "$sha" "$date" > dist/build-fingerprint.txt

      - name: Smoke test (local preview)
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/apps/web"
          npx astro preview --host 127.0.0.1 --port 4321 >/tmp/preview.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4321/health.json >/dev/null && break
            sleep 1
          done
          bash "${GITHUB_WORKSPACE}/infra/deploy/smoke.sh" http://127.0.0.1:4321

      - name: Mobile overflow check (Playwright)
        shell: bash
        env:
          PREVIEW_URL: http://127.0.0.1:4321
        run: |
          cd "${GITHUB_WORKSPACE}/apps/web"
          timeout 180 npx playwright install chromium --with-deps
          if ! curl -fsS http://127.0.0.1:4321/health.json >/dev/null; then
            npx astro preview --force --host 127.0.0.1 --port 4321 >/tmp/preview2.log 2>&1 &
            for _ in $(seq 1 20); do
              curl -fsS http://127.0.0.1:4321/health.json >/dev/null && break
              sleep 1
            done
          fi
          curl -fsS http://127.0.0.1:4321/health.json
          node qa/mobile-overflow.spec.mjs

      - name: About tabs regression (Playwright)
        shell: bash
        env:
          PREVIEW_URL: http://127.0.0.1:4321
        run: |
          cd "${GITHUB_WORKSPACE}/apps/web"
          if ! curl -fsS http://127.0.0.1:4321/health.json >/dev/null; then
            npx astro preview --force --host 127.0.0.1 --port 4321 >/tmp/preview3.log 2>&1 &
            for _ in $(seq 1 20); do
              curl -fsS http://127.0.0.1:4321/health.json >/dev/null && break
              sleep 1
            done
          fi
          curl -fsS http://127.0.0.1:4321/health.json
          node qa/about-tabs.spec.mjs
          npx astro preview stop || true

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify artifact completeness and no secrets
        run: |
          test -f dist/health.json
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/index.html
          test -f dist/en/index.html
          test -f dist/fa/index.html
          if grep -rIiE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|password\s*[:=]\s*[^ ]{6,})' dist/ --exclude-dir=_astro; then
            echo "secret-like pattern found in artifact" >&2
            exit 1
          fi

      - name: Pagefind index verification (per-locale, count, drafts excluded)
        run: node qa/pagefind.spec.mjs

      - name: Sitemap verification (static + dynamic entries, no draft/admin)
        run: node qa/sitemap.spec.mjs

      - name: Health artifact verification (static vs CMS distinction)
        run: node qa/health.spec.mjs

      - name: Upload static artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

  # Parity job: builds with mocked CMS_API_BASE (http://127.0.0.1:xxxx) and asserts
  # API count == dist links for P8 catalogs (publications/books/talks/downloads).
  # Catches the CI (unset) vs CD (https://tahamohamadi.ir) drift where snapshot
  # empty/catalog mismatches would otherwise ship to production.
  p8-catalog-mock:
    name: P8 catalog mock CMS parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: node qa/p8-catalog.spec.mjs
