name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Check and build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Smoke test (local preview)
        shell: bash
        run: |
          npx astro preview --port 4321 >/tmp/preview.log 2>&1 &
          sleep 8
          bash ../infra/deploy/smoke.sh http://localhost:4321
          kill %1

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify artifact completeness and no secrets
        run: |
          test -f dist/health.json
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/index.html
          test -f dist/en/index.html
          test -f dist/fa/index.html
          if grep -rIiE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|password\s*[:=]\s*[^ ]{6,})' dist/; then
            echo "secret-like pattern found in artifact" >&2
            exit 1
          fi

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
