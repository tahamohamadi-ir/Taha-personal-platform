# taha-admin SPA fallback config (ADR-0032 S2)
# /admin/ is the app root; unknown /admin/* paths fall back to index.html.
server {
  listen 80;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store";
  }

  location = /admin {
    return 308 /admin/;
  }
}
