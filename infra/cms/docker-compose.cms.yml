# CMS runtime — Docker Compose for stateful CMS + PostgreSQL only.
#
# Architecture (canonical):
#   Caddy (edge TLS + routing)
#     ├── static Astro artifact  → /opt/taha/site/current  (NOT containerized)
#     └── CMS                    → 127.0.0.1:18000 (this compose stack)
#
# Versioned image (preferred production path):
#   export CMS_IMAGE=ghcr.io/tahamohamadi-ir/taha-cms:<git-sha>
#   docker compose -f infra/cms/docker-compose.cms.yml pull
#   docker compose -f infra/cms/docker-compose.cms.yml up -d
#
# Local/rebuild path (optional):
#   export CMS_IMAGE=taha-cms:local
#   docker compose -f infra/cms/docker-compose.cms.yml build
#   docker compose -f infra/cms/docker-compose.cms.yml up -d
#
# Secrets: create infra/cms/.env from .env.example (never commit real .env).

name: taha-cms

services:
  db:
    image: postgres:17-alpine
    hostname: db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    networks:
      cms_internal:
        aliases:
          - db
          - postgres

  cms:
    image: ${CMS_IMAGE:-ghcr.io/tahamohamadi-ir/taha-cms:main}
    build:
      context: ../..
      dockerfile: infra/cms/Dockerfile.cms
    pull_policy: ${CMS_PULL_POLICY:-missing}
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    user: "10001:10001"
    mem_limit: 512m
    cpus: "0.50"
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - cms_static:/app/staticfiles
      - cms_media:/app/media
    networks:
      cms_internal:
        aliases:
          - cms
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)); raise SystemExit(0 if d.get('db')=='ok' else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5

volumes:
  postgres_data:
  cms_static:
  cms_media:

networks:
  cms_internal:
